components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Bearer token authentication using OAuth2/OIDC tokens
  parameters:
    RegionPathParam:
      name: region
      in: path
      required: true
      schema:
        type: string
      description: Region identifier
    ProjectPathParam:
      name: project
      in: path
      required: true
      schema:
        type: string
      description: Project identifier
    PageToken:
      name: pageToken
      in: query
      required: false
      schema:
        type: string
      description: Token for cursor-based pagination
    PageSize:
      name: pageSize
      in: query
      required: false
      schema:
        type: integer
        default: 50
        minimum: 1
        maximum: 500
      description: Maximum number of results per page
  schemas:
    Cluster:
      type: object
      description: |
        Kubernetes cluster resource.
      properties:
        selfLink:
          type: string
          format: uri
          description: Server-defined URL for this resource.
          readOnly: true
          example: /v1/regions/us-texas-1/projects/project-x9y8z7/compute/clusters/cluster-a1b2c3
        uid:
          type: string
          description: Server-generated UUID.
          format: uuid
          readOnly: true
        id:
          type: string
          description: Name of the resource. Provided by the client when the resource is created, or generated by the server if not specified. Must be 1-63 characters long and match the pattern [a-z]([\-a-z0-9]*[a-z0-9])? — the first character must be a lowercase letter, and all following characters must be lowercase letters, digits, or hyphens, with the last character being a letter or digit. Cannot be changed after the resource is created.
          pattern: ^[a-z]([-a-z0-9]*[a-z0-9])?$
          minLength: 1
          maxLength: 63
          example: cluster-a1b2c3
        displayName:
          type: string
          description: Optional human-friendly display name for the cluster.
        description:
          type: string
          description: An optional description of this resource.
        nodePools:
          type: array
          description: Node pools belonging to this cluster.
          items:
            type: object
            properties:
              role:
                type: string
                enum:
                  - worker
                  - control-plane
                description: Role of the node pool.
              network:
                type: string
                format: uri
                description: |
                  URL of the network this node pool is attached to.
                example: /v1/regions/us-texas-1/projects/project-x9y8z7/compute/networks/network-g7h8i9
              subnet:
                type: string
                format: uri
                description: |
                  URL of the subnet this node pool uses.
              nodeCount:
                type: integer
                description: Number of nodes in pool
              instanceType:
                type: string
                description: Instance type for nodes
        status:
          type: object
          description: Cluster health and readiness state.
          properties:
            phase:
              type: string
              description: Lifecycle phase (e.g., Provisioning, Running, Deleting)
            conditions:
              type: array
              items:
                type: object
                description: Cluster conditions
        nodeCount:
          type: integer
          description: Number of nodes in cluster.
        kubernetesVersion:
          type: string
          description: Kubernetes version.
        endpoint:
          type: object
          description: Cluster endpoint details.
          properties:
            url:
              type: string
              description: Cluster API endpoint URL
            caCertificate:
              type: string
              description: CA certificate for endpoint
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    ClusterCreateRequest:
      type: object
      description: Request to create Kubernetes cluster.
      properties:
        kubernetesVersion:
          type: string
          description: Desired Kubernetes version
        id:
          type: string
          description: Name of the resource. Must be 1-63 characters long and match the pattern [a-z]([\-a-z0-9]*[a-z0-9])? — the first character must be a lowercase letter, and all following characters must be lowercase letters, digits, or hyphens, with the last character being a letter or digit. If not specified, the server will generate a name.
          pattern: ^[a-z]([-a-z0-9]*[a-z0-9])?$
          minLength: 1
          maxLength: 63
          example: cluster-a1b2c3
        displayName:
          type: string
          description: Optional human-friendly display name for the cluster.
        description:
          type: string
          description: An optional description of this resource.
        nodePools:
          type: array
          description: Node pools belonging to this cluster.
          items:
            type: object
            properties:
              role:
                type: string
                enum:
                  - worker
                  - control-plane
                description: Role of the node pool.
              network:
                type: string
                format: uri
                description: |
                  URL of the network this node pool is attached to.
                example: /v1/regions/us-texas-1/projects/project-x9y8z7/compute/networks/network-g7h8i9
              subnet:
                type: string
                format: uri
                description: |
                  URL of the subnet this node pool uses.
              nodeCount:
                type: integer
                description: Number of nodes in pool
              instanceType:
                type: string
                description: Instance type for nodes
    ClusterUpdateRequest:
      type: object
      description: |
        Request to update cluster configuration.
      properties:
        displayName:
          type: string
          description: Updated human-friendly display name for the cluster.
        description:
          type: string
          description: Updated description of this resource.
        kubernetesVersion:
          type: string
          description: Upgrade to Kubernetes version
        nodePools:
          type: array
          description: Node pools belonging to this cluster.
          items:
            type: object
            properties:
              role:
                type: string
                enum:
                  - worker
                  - control-plane
                description: Role of the node pool.
              network:
                type: string
                format: uri
                description: |
                  URL of the network this node pool is attached to.
                example: /v1/regions/us-texas-1/projects/project-x9y8z7/compute/networks/network-g7h8i9
              subnet:
                type: string
                format: uri
                description: |
                  URL of the subnet this node pool uses.
              nodeCount:
                type: integer
                description: Number of nodes in pool
              instanceType:
                type: string
                description: Instance type for nodes
    NodePool:
      type: object
      description: Node pool resource.
      properties:
        selfLink:
          type: string
          format: uri
          description: Server-defined URL for this resource.
          readOnly: true
          example: /v1/regions/us-texas-1/projects/project-x9y8z7/compute/clusters/cluster-a1b2c3/nodepools/nodepool-m4n5o6
        uid:
          type: string
          description: Server-generated UUID.
          format: uuid
          readOnly: true
        id:
          type: string
          description: Name of the resource. Provided by the client when the resource is created, or generated by the server if not specified. Must be 1-63 characters long and match the pattern [a-z]([\-a-z0-9]*[a-z0-9])? — the first character must be a lowercase letter, and all following characters must be lowercase letters, digits, or hyphens, with the last character being a letter or digit. Cannot be changed after the resource is created.
          pattern: ^[a-z]([-a-z0-9]*[a-z0-9])?$
          minLength: 1
          maxLength: 63
          example: nodepool-m4n5o6
        displayName:
          type: string
          description: Optional human-friendly display name for the node pool.
        description:
          type: string
          description: An optional description of this resource.
        role:
          type: string
          enum:
            - worker
            - control-plane
          description: Role of the node pool.
        network:
          type: string
          format: uri
