        **Visibility:** `public` · `internal` (x-visibility)

        Generate a new client_secret for a service account. The secret
        is returned only in this response and cannot be retrieved again.
        Store it securely.

        Only tenant administrators can create credentials.

        A maximum of 5 active credentials are allowed per service
        account. This limit supports zero-downtime rotation: create
        a new credential, deploy it to your systems, then delete the
        old one.

        If expiresAt is omitted, the organization's default credential
