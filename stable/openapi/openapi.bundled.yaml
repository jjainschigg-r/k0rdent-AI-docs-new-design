                  description: |
                    Requested expiration timestamp. Cannot exceed the
                    org-level maximum credential lifetime. Defaults to
                    org default if omitted.
      responses:
        '201':
          description: |
            Credential created. The client_secret is included in this
            response only and cannot be retrieved again.
