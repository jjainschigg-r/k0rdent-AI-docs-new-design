        Three grant types are supported:

        **authorization_code** — Interactive user session. Exchanges an
        authorization code obtained from the OAuth2 /authorize flow.

        **api_key** — Programmatic access via an API key. The caller
        presents the opaque, prefixed API key token. Effective privileges
        are evaluated as the intersection of the key's role list (if set)
        and the creating user's current roles within the key's scope.

        **client_credentials** — Service account authentication. The
        caller presents a client_id and client_secret pair. Effective
        privileges are the service account's directly assigned roles
        within its scope.

        All grant types support optional scope narrowing at mint time:
        the caller can request a narrower scope and/or a subset of roles
        for the issued token. The requested scope must be at or below the
        credential's scope in the resource hierarchy, and the requested
        roles must be a subset of the credential's effective roles.
      tags:
        - token
      x-visibility:
        - public
        - internal
      x-status: tbd
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - grant_type
              discriminator:
                propertyName: grant_type
                mapping:
                  authorization_code: '#/components/schemas/AuthCodeGrant'
                  api_key: '#/components/schemas/ApiKeyGrant'
                  client_credentials: '#/components/schemas/ClientCredentialsGrant'
              oneOf:
                - $ref: '#/components/schemas/AuthCodeGrant'
                - $ref: '#/components/schemas/ApiKeyGrant'
                - $ref: '#/components/schemas/ClientCredentialsGrant'
      responses:
        '200':
          description: Token successfully minted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /v1/regions/global/auth/introspect:
    post:
      operationId: introspectToken
      summary: Introspect token
      description: |
        **Visibility:** `public` · `internal` (x-visibility)

        Determine whether an access token is currently active and return
        its claims. Inspired by RFC 7662 (OAuth 2.0 Token Introspection)
        but uses application/json instead of form-encoded requests.

        A token is considered active when all of the following are true:
          - The token has not expired.
          - The token has not been revoked.
          - The underlying credential (API key, service account credential)
            is still active and not disabled.
          - The parent principal (user, service account) is still active.

        This endpoint is intended for resource servers that need to
        validate a token beyond signature verification — for example,
        before executing sensitive operations where even a short-lived
        token should be checked against the current credential state.

        The caller must be authenticated (typically a resource server
        using its own service account credentials).
      tags:
        - introspect
      x-visibility:
        - public
        - internal
      x-status: tbd
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - token
              properties:
                token:
                  type: string
                  description: The access token (JWT) to introspect.
      responses:
        '200':
          description: |
            Introspection result. If the token is active, the full
            claim set is returned. If inactive, only active: false
            is returned — no claims are exposed for invalid tokens.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ActiveIntrospectionResponse'
                  - $ref: '#/components/schemas/InactiveIntrospectionResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /v1/regions/global/auth/check:
    post:
      operationId: checkPermissions
      summary: Check permissions
      description: |
        **Visibility:** `public` · `internal` (x-visibility)

        Evaluate whether the authenticated principal (or a specified
        subject) is allowed to perform one or more actions on target
        resources. Supports both single and bulk checks in a single
        request.

        **Self-check** — When no subject is specified, the caller's
        own permissions are evaluated. Useful for frontends that need
        to show/hide UI elements based on the current user's access.

        **Subject check** — Tenant administrators can evaluate
        permissions for another principal by specifying a subject.
        Non-admin callers specifying a subject other than themselves
        receive 403.

        Results are returned positionally — results[i] corresponds
        to checks[i].
      tags:
        - check
      x-visibility:
        - public
        - internal
      x-status: tbd
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - checks
              properties:
                subject:
                  type: string
                  description: |
                    Principal to evaluate. Can be a user ID, API key ID,
                    or service account clientId. If omitted, defaults to
                    the authenticated caller. Only tenant administrators
                    can specify a subject other than themselves.
                  example: user-xyz789
                checks:
                  type: array
                  description: |
                    List of permission checks to evaluate. Each check
                    specifies an action and a target resource. Maximum
                    100 checks per request.
                  minItems: 1
                  maxItems: 100
                  items:
                    type: object
                    required:
                      - action
                      - resource
                    properties:
                      action:
                        type: string
                        description: |
                          The action to evaluate. Must be a recognized
                          action string in the format {service}.{resource}.{verb}
                          (e.g., compute.instances.create).
                        example: compute.instances.create
                      resource:
                        type: string
                        description: |
                          The target resource identifier to evaluate the
                          action against. Can be a project ID, folder ID,
                          or organization ID depending on the action's
                          scope.
                        example: proj-abc123
      responses:
        '200':
          description: Permission check results.
          content:
            application/json:
              schema:
                type: object
                required:
                  - results
                properties:
                  results:
                    type: array
                    description: |
                      Positional results — results[i] corresponds to
                      checks[i] in the request.
                    items:
                      type: object
                      required:
                        - allowed
                      properties:
                        allowed:
                          type: boolean
                          description: |
                            Whether the action is permitted on the
                            specified resource for the evaluated
                            principal.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /v1/regions/global/auth/revoke:
    post:
      operationId: revokeToken
      summary: Revoke token
      description: |
        **Visibility:** `public` · `internal` (x-visibility)

        Explicitly revoke an access token before its natural expiration.
        Once revoked, the token is added to a server-side deny list and
        will fail introspection checks immediately.

        Callers can revoke their own tokens. Tenant administrators can
        revoke any token within the tenant.

        Inspired by RFC 7009 but uses application/json instead of
        form-encoded requests. This endpoint returns 200 even if the token is
        already expired, revoked, or unrecognized. This prevents
        information leakage about token validity.

        Resource servers that enforce real-time revocation must call
        the introspect endpoint for sensitive operations, as
        self-contained JWT signature verification alone will not
        detect revoked tokens.
      tags:
        - revoke
      x-visibility:
        - public
        - internal
      x-status: tbd
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - token
              properties:
                token:
                  type: string
                  description: The access token (JWT) to revoke.
      responses:
        '200':
          description: |
            Token revocation accepted. Per RFC 7009, this status is
            returned regardless of whether the token was valid,
            already revoked, or unrecognized.
          content:
            application/json:
              schema:
                type: object
                properties:
                  revoked:
                    type: boolean
                    description: Always true on successful processing.
                    enum:
                      - true
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
