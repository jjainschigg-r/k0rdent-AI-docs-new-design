openapi: 3.1.0
info:
  title: K0rdent AI API
  version: 0.2.0-draft
  description: |
    OpenAPI specification for the K0rdent AI GPU-as-a-Service platform.
    **Custom Extensions:**
    - `x-visibility`: Endpoint visibility — `internal` (Atlas only), `public` (Arc only), `[internal, public]` (common)
    - `x-status`: Implementation status — `mvp`, `tbd`, `blocked`, `stretch`
    - `x-source`: Source document reference or `TBD` for fields pending confirmation
    **Pagination:** Cursor-based using `pageToken` and `pageSize` query parameters.
    **Error Model:** Standard `{ error: { code, message, details[] } }` envelope.
servers:
  - url: https://api.k0rdent.ai
    description: K0rdent AI API Gateway
security:
  - bearerAuth: []
tags:
  - name: clusters
    description: Kubernetes cluster management
  - name: kubeconfigs
    description: Kubeconfig issuance and management
  - name: instances
    description: VM and baremetal instance lifecycle
  - name: networks
    description: Network configuration and topology
  - name: addresses
    description: IP address management
  - name: servers
    description: Bare metal server lifecycle management
  - name: organizations
    description: Organization (tenant) management
  - name: projects
    description: Project resource grouping
  - name: authentication
    description: Authentication and session management
  - name: users
    description: User management
  - name: groups
    description: User group management
  - name: roles
    description: RBAC role definitions
  - name: policies
    description: IAM policy bindings
  - name: providers
    description: Identity provider configuration
  - name: token
    description: |
      Generate access token via multiple grant types (authorization_code, api_key, client_credentials).
  - name: check
    description: |
      Evaluate permissions for a principal against actions and resources. Supports single and bulk checks (up to 100).
  - name: introspect
    description: |
      Token introspection per RFC 7662. Validate token activity and retrieve full decoded claims.
  - name: revoke
    description: |
      Token revocation per RFC 7009. Explicitly invalidate access tokens before natural expiration.
  - name: apikeys
    description: |
      Manage API keys for programmatic access. API keys are bound to a user and inherit a dynamic subset of the user's privileges, evaluated at token-mint time.
      Keys are scoped to a level in the resource hierarchy (organization, folder, or project).
  - name: serviceaccounts
    description: |
      Manage service accounts for machine-to-machine and infrastructure
      access. Service accounts are independent principals with their own
      identity, role bindings, and credentials. They survive user
      off-boarding and are managed exclusively by tenant administrators.
paths:
  /v1/regions/{region}/projects/{project}/compute/clusters:
    parameters:
      - $ref: '#/components/parameters/RegionPathParam'
      - $ref: '#/components/parameters/ProjectPathParam'
    get:
      operationId: listClusters
      summary: List Kubernetes clusters
      description: |
        **Visibility:** `internal` · `public` (x-visibility)

        "Cluster CRUD API: manage clusters"; Retrieve list of all Kubernetes clusters in the project.
