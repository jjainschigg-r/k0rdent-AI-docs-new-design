          type: string
    post:
      operationId: rotateApiKey
      summary: Rotate API key secret
      description: |
        **Visibility:** `public` · `internal` (x-visibility)

        Generate a new secret for an existing API key. The key ID,
        metadata, and role bindings remain unchanged.

        By default the old secret is invalidated immediately. Use
        gracePeriodSeconds to keep both old and new secrets valid
        for a short overlap window, allowing zero-downtime rotation
        in distributed systems.

        Regular users can only rotate keys they created. Requests
        targeting keys owned by other users return 404 to prevent
        key ID enumeration. Tenant administrators can rotate any
        key within the tenant.

        Only active keys can be rotated. Disabled or expired keys
        must be re-enabled or recreated first.
      tags:
        - apikeys
      x-visibility:
        - public
        - internal
      x-status: tbd
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                gracePeriodSeconds:
                  type: integer
                  description: |
                    Duration in seconds during which both the old and new
                    secrets are valid. Allows distributed systems to
                    pick up the new secret without downtime.
                  default: 0
                  minimum: 0
                  maximum: 300
                  example: 120
      responses:
        '200':
          description: |
            Key rotated successfully. The new secret is included in this
            response only and cannot be retrieved again.
          content:
            application/json:
              schema:
                type: object
                description: API key metadata with the new secret value.
                allOf:
                  - $ref: '#/components/schemas/ApiKey'
                  - type: object
                    required:
                      - secret
                      - previousSecretExpiresAt
                    properties:
                      secret:
                        type: string
                        description: |
                          New opaque, prefixed API key secret. Store
                          securely — cannot be retrieved again.
                        example: plt_sk_apikey-j2k3l4_x9y8z7w6v5u4...
                      previousSecretExpiresAt:
                        type: string
                        format: date-time
                        description: |
                          Timestamp when the previous secret becomes
                          invalid. Equal to the current time when
                          gracePeriodSeconds is 0. Null if no previous
                          secret existed.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
