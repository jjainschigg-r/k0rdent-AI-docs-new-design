            (TBD): hostname template similar to [INSTANCE_NAME].[ZONE].c.[PROJECT_ID].internal; may
            change based on CSP configuration.
        lifecycle:
          type: object
          properties:
            status:
              type: string
              enum:
                - PROVISIONING
                - STAGING
                - RUNNING
                - STOPPING
                - SUSPENDING
                - SUSPENDED
                - REPAIRING
                - TERMINATED
