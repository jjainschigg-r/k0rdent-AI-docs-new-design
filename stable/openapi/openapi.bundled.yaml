    ApiKey:
      type: object
      description: |
        API key for programmatic access. Keys are scoped to a level in the
        resource hierarchy (organization, folder, or project) and inherit
        a subset of the creating user's privileges, evaluated dynamically
        at token-mint time. The key secret is an opaque, prefixed token
        shown only at creation and rotation time.
      required:
        - id
        - uid
        - displayName
        - scope
        - scopeId
        - status
        - createdAt
        - createdBy
      properties:
        selfLink:
          type: string
          format: uri
          description: Server-defined URL for this resource.
          readOnly: true
          example: /v1/iam/api-keys/apikey-j2k3l4
        uid:
          type: string
          format: uuid
          description: Server-generated UUID. Immutable.
          readOnly: true
        id:
          type: string
          description: |
            Resource identifier. Provided by the client at creation or
            server-generated if omitted. Must be 1-63 lowercase characters
            matching [a-z]([-a-z0-9]*[a-z0-9])?. Immutable after creation.
          pattern: ^[a-z]([-a-z0-9]*[a-z0-9])?$
          minLength: 1
          maxLength: 63
          example: apikey-j2k3l4
        displayName:
          type: string
          description: Human-readable display name for the API key.
          minLength: 1
          maxLength: 255
          example: CI/CD Pipeline Key
        description:
          type: string
          description: Optional description of the key's intended use.
          maxLength: 1024
        scope:
          type: string
          enum:
            - organization
            - folder
            - project
          description: |
            The level in the resource hierarchy this key is scoped to.
            Determines the resource boundary for all operations performed
            with this key:
              - organization: key can access all folders and projects the
                creating user has access to within the tenant.
              - folder: key can access all projects under the specified
                folder that the creating user has access to.
              - project: key is restricted to a single project.

            Combined with scopeId, this defines the key's blast radius.
            Subject to org-level policy constraints (e.g., an org may
            prohibit organization-scoped keys).
          example: project
        scopeId:
          type: string
          description: |
            Resource identifier corresponding to the scope level:
              - organization scope: the organization ID (derived from
                the caller's tenant — must match the caller's org).
              - folder scope: a folder ID the caller has access to.
              - project scope: a project ID the caller has access to.
          example: proj-abc123
        roles:
          type: array
          items:
            type: string
          description: |
            Optional role bindings that act as a privilege ceiling for the key.
            Effective privileges are evaluated at token-mint time, not at
            key creation time:

              - When roles are set: effective privilege is the intersection
                of this list and the creating user's current roles for the
                key's project. If the user gains or loses roles, the key's
                effective privilege adjusts automatically.
              - When empty or omitted: the key mirrors the creating user's
                full current roles for the project, expanding and shrinking
                as the user's roles change.

            Each role must be a valid org-defined role slug. At creation and
            update time, every listed role must be held by the caller;
            however, the key remains valid if the user later loses a listed
            role (it simply has no effect until the user regains it).

            Effective privileges are always bounded by the key's scope
            (organization, folder, or project).
          example:
            - compute.viewer
            - storage.reader
        status:
          type: string
          enum:
            - active
            - disabled
            - expired
          description: |
            Current key status.
              - active: Key can be used to mint tokens.
              - disabled: Temporarily suspended. Can be re-enabled via PATCH.
              - expired: Past expiresAt. Terminal; cannot be re-enabled.
          readOnly: true
          example: active
        expiresAt:
          type: string
          format: date-time
          description: |
            Key expiration timestamp. If not set at creation, defaults to
            the organization's configured maximum API key lifetime. Cannot
            exceed the org-level maximum.
        createdBy:
          type: string
          description: |
            User ID of the principal who created this key.
            The key's privilege ceiling is derived from this user.
          readOnly: true
          example: user-xyz789
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the key was created.
          readOnly: true
        updatedAt:
          type: string
          format: date-time
          description: Timestamp of the last metadata change (name, roles, status).
          readOnly: true
        lastRotatedAt:
          type: string
          format: date-time
          description: Timestamp of the most recent secret rotation. Null if never rotated.
          readOnly: true
        lastUsedAt:
          type: string
          format: date-time
          description: Timestamp of the last successful token mint using this key.
          readOnly: true
        lastUsedIp:
          type: string
          description: IP address from which the key was last used.
          readOnly: true
          example: 203.0.113.42
    ServiceAccount:
      type: object
      description: |
        Service account for machine-to-machine and infrastructure access.
        Service accounts are independent principals with their own identity
        and role bindings. They are scoped to a level in the resource
        hierarchy (organization, folder, or project) and survive the
        off-boarding of the user who created them.

        Authentication uses client_id (on this resource) combined with a
        client_secret (from a credential sub-resource) via the
        grant_type=client_credentials flow.

        Only tenant administrators can create and manage service accounts.
      required:
        - id
        - uid
        - displayName
        - clientId
        - scope
        - scopeId
        - status
        - createdAt
        - createdBy
      properties:
        selfLink:
          type: string
          format: uri
          description: Server-defined URL for this resource.
          readOnly: true
          example: /v1/iam/service-accounts/sa-pipeline-prod
        uid:
          type: string
          format: uuid
          description: Server-generated UUID. Immutable.
          readOnly: true
        id:
          type: string
          description: |
            Resource identifier. Provided by the client at creation or
            server-generated if omitted. Must be 1-63 lowercase characters
            matching [a-z]([-a-z0-9]*[a-z0-9])?. Immutable after creation.
          pattern: ^[a-z]([-a-z0-9]*[a-z0-9])?$
          minLength: 1
          maxLength: 63
          example: sa-pipeline-prod
        displayName:
          type: string
          description: Human-readable display name for the service account.
          minLength: 1
          maxLength: 255
          example: Production CI/CD Pipeline
        description:
          type: string
          description: Optional description of the service account's purpose.
          maxLength: 1024
        clientId:
          type: string
          description: |
            Unique client identifier for OAuth2 client_credentials flow.
            Server-generated, immutable. Used together with a credential's
            client_secret to authenticate at the token endpoint.
          readOnly: true
          example: sa-pipeline-prod@myorg.iam
        scope:
          type: string
          enum:
            - organization
            - folder
            - project
          description: |
            The level in the resource hierarchy this service account
            operates within:
              - organization: access across all folders and projects
                (subject to assigned roles).
              - folder: access across all projects under the specified
                folder (subject to assigned roles).
              - project: restricted to a single project.

            Subject to org-level policy constraints.
          example: project
        scopeId:
          type: string
          description: |
            Resource identifier corresponding to the scope level:
              - organization scope: the organization ID.
              - folder scope: a folder ID.
              - project scope: a project ID.
          example: proj-abc123
        roles:
          type: array
          items:
            type: string
          description: |
            Role bindings assigned directly to this service account.
            Unlike API keys, service account roles are not inherited
            from a user — they are explicitly granted. Each role must
            be a valid org-defined role slug.

            The assigning administrator can only grant roles they
            themselves hold within the service account's scope (scope-down
            principle). Effective privileges are bounded by the scope.
          example:
            - compute.deployer
            - storage.writer
        status:
          type: string
          enum:
            - active
            - disabled
          description: |
            Current service account status.
              - active: credentials can be used to mint tokens.
              - disabled: all credentials are temporarily unusable.
                Can be re-enabled via PATCH.
          readOnly: true
          example: active
        createdBy:
          type: string
          description: |
            User ID of the tenant administrator who created this
            service account.
          readOnly: true
          example: user-admin-001
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the service account was created.
          readOnly: true
        updatedAt:
          type: string
          format: date-time
          description: Timestamp of the last metadata change.
          readOnly: true
        activeCredentialCount:
          type: integer
          description: |
            Number of active (non-expired) credentials on this service
            account. Maximum of 5 credentials allowed.
          readOnly: true
          example: 2
    ServiceAccountCredential:
      type: object
      description: |
        A credential (client_secret) belonging to a service account.
        Multiple credentials can exist simultaneously for a single
        service account, enabling zero-downtime secret rotation:
        create a new credential, deploy it, then delete the old one.

        The client_secret value is returned only at creation time
        and cannot be retrieved again.

        Maximum of 5 active credentials per service account.
      required:
        - id
        - uid
        - serviceAccountId
        - status
        - createdAt
        - createdBy
      properties:
        selfLink:
          type: string
          format: uri
          description: Server-defined URL for this resource.
          readOnly: true
          example: /v1/iam/service-accounts/sa-pipeline-prod/credentials/cred-001
        uid:
          type: string
          format: uuid
          description: Server-generated UUID. Immutable.
          readOnly: true
        id:
          type: string
          description: |
            Credential identifier. Server-generated, immutable.
          readOnly: true
          example: cred-001
        serviceAccountId:
          type: string
          description: |
            The parent service account this credential belongs to.
          readOnly: true
          example: sa-pipeline-prod
        status:
          type: string
          enum:
            - active
            - expired
          description: |
            Current credential status.
              - active: can be used to authenticate.
              - expired: past expiresAt. Terminal; cannot be re-enabled.

            Note: if the parent service account is disabled, all its
            credentials are effectively unusable regardless of their
            individual status.
          readOnly: true
          example: active
        expiresAt:
          type: string
          format: date-time
          description: |
            Credential expiration timestamp. If not set at creation,
            defaults to the organization's configured maximum credential
            lifetime. Cannot exceed the org-level maximum.
        createdBy:
          type: string
          description: |
            User ID of the administrator who created this credential.
          readOnly: true
          example: user-admin-001
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the credential was created.
          readOnly: true
        lastUsedAt:
          type: string
          format: date-time
          description: |
            Timestamp of the last successful token mint using this
            credential. Null if never used.
          readOnly: true
        lastUsedIp:
          type: string
          description: IP address from which this credential was last used.
          readOnly: true
          example: 203.0.113.42
    AuthCodeGrant:
      type: object
      required:
        - grant_type
        - code
        - redirect_uri
      properties:
        grant_type:
          type: string
          enum:
            - authorization_code
        code:
          type: string
          description: Authorization code from the OAuth2 /authorize flow.
        redirect_uri:
          type: string
          format: uri
          description: |
            Redirect URI that was used in the authorization request.
            Must match exactly.
        scope_narrowing:
          $ref: '#/components/schemas/ScopeNarrowing'
    ApiKeyGrant:
      type: object
      required:
        - grant_type
        - api_key
      properties:
        grant_type:
          type: string
          enum:
            - api_key
        api_key:
          type: string
          description: |
            The opaque, prefixed API key token (e.g., plt_sk_...).
        scope_narrowing:
          $ref: '#/components/schemas/ScopeNarrowing'
    ClientCredentialsGrant:
      type: object
      required:
        - grant_type
        - client_id
        - client_secret
      properties:
        grant_type:
          type: string
          enum:
            - client_credentials
        client_id:
          type: string
          description: |
            Service account client identifier.
        client_secret:
          type: string
          description: |
            Credential secret for the service account.
        scope_narrowing:
          $ref: '#/components/schemas/ScopeNarrowing'
    ScopeNarrowing:
      type: object
      description: |
        Optional scope narrowing for the minted token. When provided,
        the issued JWT will have a narrower scope and/or fewer roles
        than the credential's effective privileges. The requested
        scope must be at or below the credential's scope level in
        the hierarchy (org > folder > project), and the requested
        roles must be a subset of the effective roles.
      properties:
        scope:
          type: string
          enum:
            - organization
            - folder
            - project
          description: |
            Requested scope level for the token. Must be at or
            below the credential's scope level.
        scopeId:
          type: string
          description: |
            Resource identifier for the requested scope. Must be
            within the credential's scope boundary.
          example: proj-abc123
        roles:
          type: array
          items:
            type: string
          description: |
            Subset of roles to include in the token. Each must be
            within the credential's effective roles.
          example:
            - storage.reader
    TokenResponse:
      type: object
      required:
        - access_token
        - token_type
        - expires_in
      properties:
        access_token:
          type: string
          description: |
            Self-contained JWT access token. Contains claims for
            sub, iss, aud, exp, iat, jti, tenant_id, scope,
            scope_id, roles, and principal_type.
        token_type:
          type: string
          enum:
            - Bearer
          description: Token type. Always "Bearer".
        expires_in:
          type: integer
          description: Token lifetime in seconds.
          example: 900
        refresh_token:
          type: string
          description: |
            Refresh token for obtaining new access tokens without
            re-authentication. Only issued for the authorization_code
            grant type. Not issued for api_key or client_credentials
            grants.
    ActiveIntrospectionResponse:
      type: object
      description: |
        Returned when the token is valid and active. Includes
        the full decoded claim set per RFC 7662.
      required:
        - active
        - sub
        - iss
        - aud
        - exp
        - iat
        - jti
        - tenant_id
        - scope
        - scope_id
        - roles
        - principal_type
      properties:
        active:
          type: boolean
          enum:
            - true
          description: Token is active.
        sub:
          type: string
          description: |
            Subject — the principal identifier. User ID for
            interactive sessions and API keys, service account
            clientId for client_credentials.
          example: user-xyz789
        iss:
          type: string
          description: Issuer URL.
          example: https://auth.platform.example.com
        aud:
          type: string
          description: Intended audience.
        exp:
          type: integer
          description: Expiration time (Unix timestamp).
        iat:
          type: integer
          description: Issued-at time (Unix timestamp).
        jti:
          type: string
          description: Unique token identifier.
        tenant_id:
          type: string
          description: Organization/tenant identifier.
          example: org-acme
        scope:
          type: string
          enum:
            - organization
            - folder
            - project
          description: |
            The resource hierarchy level this token is scoped to.
        scope_id:
          type: string
          description: |
            Resource identifier for the token's scope boundary.
          example: proj-abc123
        roles:
          type: array
          items:
            type: string
          description: |
            Effective roles for this token. For API keys, this
            is the intersection of the key's roles and the user's
            current roles. For service accounts, these are the
            directly assigned roles. May be further narrowed if
            scope narrowing was applied at mint time.
          example:
            - compute.viewer
            - storage.reader
        principal_type:
          type: string
          enum:
            - user
            - api_key
            - service_account
          description: |
            How the caller authenticated. Allows downstream
            services to apply principal-type-specific policies.
        credential_id:
          type: string
          description: |
            Identifier of the credential used to mint this token.
            API key ID for api_key grants, credential ID for
            client_credentials grants. Null for interactive
            sessions.
          example: apikey-j2k3l4
    InactiveIntrospectionResponse:
      type: object
      description: |
        Returned when the token is invalid, expired, revoked, or
        the underlying credential/principal is inactive. No claims
        are exposed for security — only the active flag is returned.
      required:
        - active
      properties:
        active:
          type: boolean
          enum:
            - false
          description: Token is not active.
    IdentityProvider:
      type: object
      description: |
        External identity provider configuration. Supports only OIDC providers.
      required:
        - id
        - uid
        - displayName
        - enabled
        - tenantDomain
        - oidcConfig
        - createdAt
      properties:
        selfLink:
          type: string
          format: uri
          description: Server-defined URL for this resource.
          readOnly: true
          example: /v1/regions/global/iam/providers/provider-m5n6o7
        uid:
          type: string
          description: Server-generated UUID.
          format: uuid
          readOnly: true
        id:
          type: string
          description: Name of the resource. Provided by the client when the resource is created, or generated by the server if not specified. Must be 1-63 characters long and match the pattern [a-z]([\-a-z0-9]*[a-z0-9])? — the first character must be a lowercase letter, and all following characters must be lowercase letters, digits, or hyphens, with the last character being a letter or digit. Cannot be changed after the resource is created.
          pattern: ^[a-z]([-a-z0-9]*[a-z0-9])?$
          minLength: 1
          maxLength: 63
          example: provider-m5n6o7
        displayName:
          type: string
          description: Human-readable display name for the identity provider.
          minLength: 1
          maxLength: 255
          example: Customer A OIDC
        enabled:
          type: boolean
          description: Provider enabled status
        tenantDomain:
          type: string
          description: Tenant domain associated with the provider. Will be used as login hint for OIDC authentication flows.
        oidcConfig:
          type: object
          description: OIDC configuration details for onboarding the provider.
          required:
            - discoveryUrl
            - clientId
          properties:
            discoveryUrl:
              type: string
              description: The OpenID Connect discovery URL (well-known endpoint).
              format: uri
              example: https://customerA-idp.com/.well-known/openid-configuration
            clientId:
              type: string
              description: The Client ID issued by the external Identity Provider.
              example: CLIENT_ID_FROM_CUSTOMER
            clientSecret:
              type: string
              description: The Client Secret issued by the external Identity Provider. Write-only — never returned in responses.
              writeOnly: true
        createdAt:
          type: string
          format: date-time
          description: Provider creation timestamp
          readOnly: true
        updatedAt:
          type: string
          format: date-time
          description: Provider last update timestamp
          readOnly: true
  responses:
    BadRequest:
      description: Bad request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: Forbidden
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    InternalServerError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: |
        The request conflicts with the current state of a resource.
        Common causes include attempting to create a resource with an
        identifier that already exists, or performing a state transition
        that is not permitted (e.g., re-enabling an expired API key,
        rotating a disabled key).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            duplicateId:
              summary: Resource ID already exists
              value:
                code: CONFLICT
                message: A resource with id 'my-deploy-key' already exists.
            invalidStateTransition:
              summary: Invalid state transition
              value:
                code: CONFLICT
                message: Cannot rotate a disabled API key. Re-enable it first.
